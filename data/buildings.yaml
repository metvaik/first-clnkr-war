  - id: clnkr_mine
    name: Resource Collector
    faction: clnkr
    role: collector
    shape: building
    domain: ground
    cost: 800
    hp: 400
    footprint: 2
    buffer: 1000
    sight: 12
    build_s: 12

  # Neutral hack site. HP is a placeholder: the design tables do not list it.
